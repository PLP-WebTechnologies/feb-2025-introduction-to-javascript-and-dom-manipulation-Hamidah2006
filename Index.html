<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic JS Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #message {
      color: green;
    }
    .highlight {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Dynamic Page</h1>
  </header>

  <main>
    <section>
      <p id="message">Hello! This message will change dynamically.</p>
      <button onclick="changeText()">Change Text</button>
    </section>

    <section>
      <button onclick="toggleStyle()">Toggle Highlight</button>
    </section>

    <section>
      <button onclick="addElement()">Add Element</button>
      <button onclick="removeElement()">Remove Element</button>
      <div id="container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Dynamic Site</p>
  </footer>

  <script src="Script.js"></script>
</body>
        </html>
